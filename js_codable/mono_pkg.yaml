# See https://github.com/google/mono_repo.dart for details on this file
sdk:
- pubspec
- dev

stages:
- analyzer_and_format:
  - group:
    - format
    - analyze: --fatal-infos .
    sdk: dev
  - group:
      - analyze
    sdk: pubspec
- unit_test:
  - test:
  - test: -p chrome
  - test: -p chrome --compiler dart2wasm

cache:
  directories:
  - .dart_tool/build
