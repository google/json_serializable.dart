name: js_codable
version: 0.1.0-wip
description: >-
  Generate zero-copy dart:js_interop extension types and converters for Dart
  classes annotated with @JsonSerializable.
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  analyzer: '>=10.0.0 <15.0.0'
  build: '>=4.0.4 <6.0.0'
  build_config: ^1.2.0
  code_builder: ^4.13.0
  dart_style: ^3.1.4
  json_annotation: '>=4.12.0 <4.13.0'
  json_serializable: ^7.0.0-wip
  meta: ^1.16.0
  path: ^1.9.0
  source_gen: ^4.1.2
  source_helper: ^1.4.0

dev_dependencies:
  build_runner: ^2.10.5
  build_test: ^3.5.0
  checks: ^0.3.0
  source_gen_test: ^1.4.1
  test: ^1.29.0
